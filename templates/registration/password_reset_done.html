{% extends "base.html" %}
{% block title %}Reset link sent · CS/CIS Session Registration{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body text-center">
            <span class="empty-icon mb-3" aria-hidden="true"><i class="bi bi-envelope-check"></i></span>
            <h1 class="auth-title">Check your email</h1>
            <p class="auth-subtitle mb-3">If an account exists for that address, a password reset link is on its way.</p>
            <a class="btn btn-brand" href="{% url 'login' %}">Back to sign in</a>
        </div>
    </div>
</div>
{% endblock %}
