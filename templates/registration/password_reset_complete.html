{% extends "base.html" %}
{% block title %}Password updated · CS/CIS Session Registration{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body text-center">
            <span class="empty-icon mb-3" aria-hidden="true"><i class="bi bi-shield-check"></i></span>
            <h1 class="auth-title">Password updated</h1>
            <p class="auth-subtitle mb-3">Your password has been changed. You can sign in with the new password.</p>
            <a class="btn btn-brand" href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
