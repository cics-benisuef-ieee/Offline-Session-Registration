{% extends "base.html" %}
{% block title %}Password updated · CS/CIS Session Registration{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="card">
        <div class="card-body p-4 text-center">
            <h1 class="h4">Password updated</h1>

            <a class="btn btn-brand" href="{% url 'login' %}">Sign in</a>
        </div>
    </div>
</div>
{% endblock %}
