{% extends "base.html" %}
{% load static crispy_forms_tags %}
{% block title %}Reset password · CS/CIS Session Registration{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="auth-header">
        <img src="{% static 'images/logo.png' %}" alt="CS/CIS Beni-Suef Chapter logo" class="auth-logo">
        <h1 class="auth-title">Reset your password</h1>
        <p class="auth-subtitle">Enter the email address used for your account.</p>
    </div>
    <div class="card">
        <div class="card-body">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-brand w-100 mt-3">
                    <i class="bi bi-envelope" aria-hidden="true"></i> Send reset link
                </button>
            </form>
        </div>
    </div>
    <p class="auth-footer"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
