{% extends "base.html" %}
{% load crispy_forms_tags %}
{% block title %}Reset password · CS/CIS Session Registration{% endblock %}
{% block content %}
<div class="auth-card">
    <div class="text-center mb-4">
        <div class="brand-mark mx-auto mb-3" style="height:3rem;width:5rem;font-size:1.2rem;">CS/CIS</div>
        <h1 class="h3 mb-1">Reset your password</h1>
        <p class="text-muted mb-0">Enter the email address used for your account.</p>
    </div>
    <div class="card">
        <div class="card-body p-4">
            <form method="post">
                {% csrf_token %}
                {{ form|crispy }}
                <button type="submit" class="btn btn-brand w-100 mt-3">Send reset link</button>
            </form>
        </div>
    </div>
    <p class="text-center small mt-3 mb-0"><a href="{% url 'login' %}">Back to sign in</a></p>
</div>
{% endblock %}
